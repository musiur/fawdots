# See https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

background {
    monitor =
    path = /usr/share/hypr/lockdead2.png
    blur_passes = 2
    blur_size = 7
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.64
    dots_center = true
    outer_color = rgb(151515)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M %p")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 55
    font_family = sans-serif
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(255, 255, 255, 0.75)
    font_size = 20
    font_family = sans-serif
    position = 0, 90
    halign = center
    valign = center
}

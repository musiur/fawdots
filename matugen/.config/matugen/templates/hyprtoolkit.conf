# Generated by matugen from the current wallpaper — do not hand-edit.
# Read by hyprlauncher (and any other hyprtoolkit-based app) from
# ~/.config/hypr/hyprtoolkit.conf. hyprtoolkit watches this file via
# inotify and hot-reloads on change, so no restart/post_hook is needed.
# See https://github.com/hyprwm/hyprtoolkit

# hyprtoolkit's colors are plain 0xAARRGGBB ints (not hyprlang's rgba()
# color type), so alpha is spelled out here explicitly as opaque (ff).
background       = 0xff{{colors.background.default.hex_stripped}}
base             = 0xff{{colors.surface.default.hex_stripped}}
text             = 0xff{{colors.on_background.default.hex_stripped}}
alternate_base   = 0xff{{colors.outline.default.hex_stripped}}
bright_text      = 0xff{{colors.on_primary.default.hex_stripped}}
link_text        = 0xff{{colors.tertiary.default.hex_stripped}}
accent           = 0xff{{colors.primary.default.hex_stripped}}
accent_secondary = 0xff{{colors.secondary.default.hex_stripped}}

# Ubuntu/Yaru's actual corner metrics (libadwaita: ~12px dialogs, ~6px
# controls) rather than hyprtoolkit's slightly smaller defaults (10/5).
rounding_large = 12
rounding_small = 6

# The Ubuntu font is the single biggest visual tell of "looks like Ubuntu" —
# needs ttf-ubuntu-font-family (see install.sh).
font_family = Ubuntu
font_family_monospace = Ubuntu Mono

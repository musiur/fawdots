# Generated by matugen from the current wallpaper — do not hand-edit.
# Source template: ~/.config/matugen/templates/hyprlock.conf
# See https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

background {
    monitor =
    path = {{image}}
    blur_passes = 2
    blur_size = 7
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.64
    dots_center = true
    outer_color = rgb({{colors.primary.default.hex_stripped}})
    inner_color = rgb({{colors.surface.default.hex_stripped}})
    font_color = rgb({{colors.on_surface.default.hex_stripped}})
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M %p")"
    color = rgba({{colors.on_background.default.hex_stripped}}e6)
    font_size = 55
    font_family = sans-serif
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba({{colors.on_background.default.hex_stripped}}bf)
    font_size = 20
    font_family = sans-serif
    position = 0, 90
    halign = center
    valign = center
}

# AAC negotiates successfully and the sink reports RUNNING, but this
# adapter/device combo (CMF Neckband Pro) produces silent audio over AAC
# despite libfdk-aac being installed and correctly linked — confirmed by
# switching the card profile to SBC live, which worked immediately.
# SBC/SBC-XQ are the only other codecs this device advertises, so drop AAC
# from the enabled set entirely rather than relying on profile priority.
monitor.bluez.properties = {
  bluez5.codecs = [ sbc, sbc_xq ]
}
